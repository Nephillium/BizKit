services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchcrafter
      POSTGRES_PASSWORD: pitchcrafter
      POSTGRES_DB: pitchcrafter
    ports:
      - "5432:5432"
    volumes:
      - pitchcrafter_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchcrafter -d pitchcrafter"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pitchcrafter_pg:
